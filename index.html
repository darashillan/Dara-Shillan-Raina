<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AMÒ Clay Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="gate">

    <!-- Halaman kiri: foto dalam bingkai lengkung (mengikuti bentuk arch di logo) -->
    <section class="gallery" id="gallery" aria-label="Ilustrasi AMÒ Clay Studio">
      <a class="pager pager--next" href="#entry">Sign in <span aria-hidden="true">&rarr;</span></a>
      <figure class="arch">
        <img class="arch__img" src="img/clay-studio.jpg"
             alt="Tangan membentuk mangkuk tanah liat di meja kayu studio keramik">
      </figure>
    </section>

    <!-- Halaman kanan: formulir -->
    <section class="entry" id="entry" aria-labelledby="entry-title">
      <a class="pager pager--back" href="#gallery" aria-label="Kembali ke halaman gambar"><span aria-hidden="true">&larr;</span> Back</a>

      <div class="entry__inner">
        <img class="brand" src="img/logo-amo.png" alt="AMÒ Clay Studio">
        <h1 class="entry__title" id="entry-title">Sign in to AMÒ</h1>
        <p class="entry__lead">Book classes and manage your pieces.</p>

        <form class="login" action="#" method="post">
          <button type="button" class="btn btn--outline">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/>
            </svg>
            Sign in with Google
          </button>

          <div class="or" role="separator" aria-label="atau"><span>or</span></div>

          <div class="field">
            <label class="field__label" for="email">Email or username</label>
            <input class="field__box" type="text" id="email" name="email"
                   placeholder="Enter email or username" autocomplete="username" required>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="field__holder">
              <input class="field__box" type="password" id="password" name="password"
                     placeholder="Enter your password" autocomplete="current-password" required>
            </div>
          </div>

          <div class="aux">
            <div class="remember">
              <input class="remember__box" type="checkbox" id="remember" name="remember">
              <label class="remember__label" for="remember">Remember Me</label>
            </div>
            <a class="link" href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn--solid">Sign In</button>
        </form>

        <p class="legal">
          By continuing, you agree to our <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy Policy</a>.
        </p>
      </div>
    </section>

  </main>
</body>
</html>
